name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag version to release (e.g., 2.3.0)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Resolve tag commit
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Download portable zips from build workflow
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: build.yml
          workflow_conclusion: success
          commit: ${{ steps.tag.outputs.sha }}
          event: push
          path: ./artifacts

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          files=(artifacts/**/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No portable zip artifacts found" >&2
            exit 1
          fi
          gh release create "${{ github.event.inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Version ${{ github.event.inputs.tag }}" \
            --draft \
            "${files[@]}"
