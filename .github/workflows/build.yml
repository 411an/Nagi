name: Nagi CI

on:
  push:
    branches: [master]
    tags: ['*.*.*']
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            **/Directory.Packages.props
            **/NuGet.config

      - uses: FedericoCarboni/setup-ffmpeg@v3.1

      - name: Run tests
        run: dotnet test --project tests/Nagi.Core.Tests/Nagi.Core.Tests.csproj -c Release --report-xunit-trx --report-xunit-trx-filename test-results.trx

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: '**/test-results.trx'

  publish-portable:
    name: Publish portable zip
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            **/Directory.Packages.props
            **/NuGet.config

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Directory.Build.props -Pattern '<Version>([^<]+)').Matches[0].Groups[1].Value
          echo "value=$v" >> $env:GITHUB_OUTPUT

      - name: Publish unpackaged self-contained
        run: >
          dotnet publish src/Nagi.WinUI/Nagi.WinUI.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:Platform=${{ matrix.platform }}
          -p:PublishReadyToRun=true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -o ${{ github.workspace }}/publish/${{ matrix.rid }}

      - name: Zip publish folder
        shell: pwsh
        run: |
          $name = "NagiPortable-${{ steps.version.outputs.value }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path "${{ github.workspace }}/publish/${{ matrix.rid }}/*" -DestinationPath "${{ github.workspace }}/$name"
          echo "ZIP=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: NagiPortable-${{ matrix.rid }}
          path: ${{ github.workspace }}/NagiPortable-${{ steps.version.outputs.value }}-${{ matrix.rid }}.zip
          if-no-files-found: error
